<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #222; }

<body>

<div class="row">
  <div class="col">

<script>
window.addEventListener("error", function(e) {
  const el = document.getElementById("globalErr");
  if (!el) return;
  el.style.display = "block";
  el.textContent = "❌ JS错误: " + (e.message || e.error);
});
window.addEventListener("unhandledrejection", function(e) {
  const el = document.getElementById("globalErr");
  if (!el) return;
  el.style.display = "block";
  el.textContent = "❌ 异步错误: " + (e.reason && (e.reason.message || e.reason));
});

let EMB = [], SONG_MAP = {}, OUT_DIR = null;
let LIB_READY = false;
let API_KEY = localStorage.getItem("dashscope_key") || "";
let STATE = { segments: [], cur: 0, duration: 0 };
let EXPORT_FMT = "mp3";
let actx = null;
let VIDEO_DUR = 0;
let analyzeVideoEl = null;
let curPreviewSource = null, curPreviewGain = null, playTimer = null, previewToken = 0;

const CROSSFADE_SEC = 4.0, FADE_IN = 2.0, FADE_OUT = 3.0;
const MERGE_SIM_THRESHOLD = 0.72, MAX_MUSIC_SEGMENTS = 4;

function getCtx() { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function yieldUI() { return new Promise(r=>setTimeout(r,0)); }
function esc(s) { return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function stopPreview() {
  previewToken++;
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  try {
    if (curPreviewSource) { try { curPreviewSource.onended = null; curPreviewSource.stop(); } catch(e){} curPreviewSource = null; }
    if (curPreviewGain) { try { curPreviewGain.disconnect(); } catch(e){} curPreviewGain = null; }
  } catch(e){}
  const bar = document.getElementById("seekBar");
  if (bar) bar.value = 0;
  const ct = document.getElementById("curTime"); if (ct) ct.textContent = "0:00";
  const dt = document.getElementById("durTime"); if (dt) dt.textContent = "0:00";
}

document.querySelectorAll(".fmt-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".fmt-btn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    EXPORT_FMT = btn.dataset.fmt;
  };
});

document.getElementById("apiKey").value = API_KEY;
document.getElementById("saveKeyBtn").onclick = () => {
  API_KEY = document.getElementById("apiKey").value.trim();
  localStorage.setItem("dashscope_key", API_KEY);
  document.getElementById("apiMsg").textContent = "✅ 已保存（"+API_KEY.length+"字符）";
  document.getElementById("apiMsg").className = "api-msg ok";
};

document.getElementById("testKeyBtn").onclick = async () => {
  const msg = document.getElementById("apiMsg");
  const key = document.getElementById("apiKey").value.trim();
  if (!key) { msg.textContent = "⚠️ 请先填Key"; msg.className = "api-msg err"; return; }
  msg.textContent = "⏳ 测试中..."; msg.className = "api-msg";
  try {
    const r = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings", {
      method: "POST",
      headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
      body: JSON.stringify({ model: "text-embedding-v3", input: ["test"], dimensions: 1024, encoding_format: "float" })
    });
    if (!r.ok) { const e = await r.json().catch(()=>({error:{message:r.statusText}})); throw new Error(e.error?.message || r.status); }
    const j = await r.json();
    msg.textContent = `✅ 连接成功（维度 ${j.data?.[0]?.embedding?.length}）`;
    msg.className = "api-msg ok";
  } catch(e) {
    msg.textContent = `❌ ${e.message}`;
    msg.className = "api-msg err";
  }
};

function setProgress(el, pct, text) {
  el.parentElement.style.display = "block";
  el.style.width = pct + "%";
  el.textContent = `${pct}% ${text||""}`;
}

async function fetchWithProgress(url, onProgress) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP "+resp.status);
  const reader = resp.body.getReader();
  const total = parseInt(resp.headers.get("content-length")||"0");
  let received = 0; const chunks = [];
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (onProgress) onProgress(received, total);
  }
  const blob = new Blob(chunks);
  return await blob.text();
}

async function loadEmb() {
  const rb = document.getElementById("readyBar");
  const urls = [
    "https://cdn.jsdelivr.net/gh/yangchang1206/drama-bgm-toolkit@main/web/web_embeddings.json",
    "web_embeddings.json"
  ];
  let lastErr = null;
  for (const url of urls) {
    try {
      rb.textContent = "⏳ 正在从CDN下载向量索引（7.4MB）... 0%";
      rb.style.background = "#fef3c7"; rb.style.color = "#92400e";
      const text = await fetchWithProgress(url, (rec, tot) => {
        if (tot) {
          const pct = Math.round(rec/tot*100);
          const mb = (rec/1048576).toFixed(1);
          rb.textContent = `⏳ 正在下载向量索引... ${pct}%（${mb}MB）`;
        } else {
          rb.textContent = `⏳ 正在下载... ${(rec/1048576).toFixed(1)}MB`;
        }
      });
      rb.textContent = "⏳ 正在解析向量索引...";
      EMB = JSON.parse(text);
      const inst = EMB.filter(e=>e.voc!=="yes").length;
      rb.innerHTML = `✅ <b>页面就绪</b>：共${EMB.length}首，纯器乐${inst}首。`;
      rb.style.background = "#dcfce7"; rb.style.color = "#15803d";
      return;
    } catch(e) {
      lastErr = e;
      console.warn("fetch failed:", url, e);
    }
  }
  rb.innerHTML = `⚠️ 向量库加载失败：${lastErr?.message||"unknown"}。请检查网络后刷新。`;
  rb.style.background = "#fef3c7"; rb.style.color = "#92400e";
}
loadEmb();

async function scanDir(dirHandle, map) {
  let count = 0;
  const prog = document.getElementById("scanProgress");
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "directory") {
      await scanDir(entry, map);
    } else if (entry.kind === "file" && /\.(mp3|wav|m4a|ogg|flac)$/i.test(entry.name)) {
      map[entry.name.toLowerCase()] = entry;
      count++;
      if (count % 50 === 0) {
        prog.textContent = `已扫描 ${count} 个音频文件...`;
        await yieldUI();
      }
    }
  }
  return count;
}

document.getElementById("pickBtn").onclick = async () => {
  const btn = document.getElementById("pickBtn");
  const fi = document.getElementById("fileInfo");
  const prog = document.getElementById("scanProgress");
  try {
    btn.disabled = true; btn.textContent = "⏳ 等待选择文件夹...";
    const h = await window.showDirectoryPicker();
    SONG_MAP = {};
    fi.textContent = "正在扫描文件（请勿操作其他按钮）...";
    prog.textContent = "开始递归扫描...";
    const total = await scanDir(h, SONG_MAP);
    fi.textContent = `✅ 已选：${h.name}（${total} 个音频文件）`;
    prog.textContent = "";
    document.getElementById("analyzeLibBtn").disabled = false;
    btn.textContent = "📁 重新选择音乐文件夹";
  } catch(e) {
    if (e.name !== "AbortError") {
      fi.textContent = "❌ 扫描出错：" + e.message;
      fi.style.color = "#dc2626";
    } else {
      fi.textContent = "未选择";
    }
    btn.disabled = false; btn.textContent = "📁 选择音乐文件夹";
  }
};

document.getElementById("analyzeLibBtn").onclick = async () => {
  const n = Object.keys(SONG_MAP).length;
  if (!n) { alert("先选文件夹"); return; }
  const bar = document.getElementById("libPbar");
  setProgress(bar, 5, "匹配向量库...");
  await new Promise(r=>setTimeout(r,200));
  let matched = 0, list = [];
  for (const e of EMB) { if (e.voc === "yes") continue; if (SONG_MAP[e.fn.toLowerCase()]) { matched++; list.push(e.fn); } }
  setProgress(bar, 100, `完成：匹配 ${matched} 首纯器乐`);
  document.getElementById("status").textContent = `音乐库就绪：本地${n}首，可搜纯器乐${matched}首`;
  const lv = document.getElementById("libList");
  lv.innerHTML = list.slice(0,50).map(f=>`<div class="song">🎵 ${esc(f)}</div>`).join("") + (list.length>50?`<div style="color:#888;font-size:11px;padding:4px;">...共${list.length}首</div>":"");
  LIB_READY = true;
  document.getElementById("analyzeBtn").disabled = false;
};

document.getElementById("pickOutBtn").onclick = async () => {
  try { OUT_DIR = await window.showDirectoryPicker(); document.getElementById("outInfo").textContent = `导出到：${OUT_DIR.name}`; } catch(e) {}
};

async function embedText(text) {
  if (!API_KEY) throw new Error("no key");
  const r = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings", {
    method: "POST",
    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify({ model: "text-embedding-v3", input: [text], dimensions: 1024, encoding_format: "float" })
  });
  const j = await r.json();
  if (!j.data || !j.data[0]) throw new Error("embedding bad response");
  return j.data[0].embedding;
}

function decodeVec(b64) {
  const bin = atob(b64);
  const arr = new Float32Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = (bin.charCodeAt(i) - 128) / 127;
  return arr;
}

async function decodeAudioFile(fileHandle) {
  const file = await fileHandle.getFile();
  const buf = await file.arrayBuffer();
  return await getCtx().decodeAudioData(buf);
}

function analyzeMood(text) {
  const hasAction = /(滑降|悬崖|绝壁|绳索|阵风|搏斗|打|杀|爆|冲|摔|撕|逼|威胁|刀|血|追|逃|枪|棍|拳|踢)/.test(text);
  const hasDanger = /(危险|恐|怕|抖|惊|吓|死|丧|危机|陷|困|伤|痛|泪|哭|委屈|心酸|心碎|难|怒|吼|咆哮)/.test(text);
  const hasWarm = /(抱|亲|笑|开心|幸福|团圆|家|温馨|感动|眼眶通红|敬慕|父子|父女|妈妈|爸爸|回家)/.test(text);
  const hasTriumph = /(赢|胜|成功|奇迹|极品|至宝|拿下|庆祝|自信|阔步|金色|返程)/.test(text);
  let mood = "日常", query = "";
  if (hasAction && hasDanger) { mood = "紧张动作"; query = "tense action adventure cliff danger suspense epic drums thriller cinematic instrumental"; }
  else if (hasAction) { mood = "冒险史诗"; query = "adventure epic mountain exploration brave determined orchestral uplifting instrumental"; }
  else if (hasTriumph && hasWarm) { mood = "胜利温情"; query = "triumphant warm heartwarming victory family emotional strings hopeful instrumental"; }
  else if (hasTriumph) { mood = "胜利史诗"; query = "triumphant epic victorious heroic brass orchestral uplifting instrumental"; }
  else if (hasWarm) { mood = "温暖治愈"; query = "warm healing tender emotional piano strings family touching instrumental"; }
  else { mood = "日常"; query = "light casual warm acoustic gentle everyday peaceful instrumental"; }
  return { mood, query };
}

async function grabFrame(videoEl, timeSec) {
  return new Promise((resolve, reject) => {
    if (!videoEl.videoWidth) { reject(new Error("video not loaded")); return; }
    const onSeeked = () => {
      videoEl.removeEventListener("seeked", onSeeked);
      try {
        const scale = 320 / videoEl.videoWidth;
        const c = document.createElement("canvas");
        c.width = 320;
        c.height = Math.max(2, Math.round(videoEl.videoHeight * scale));
        const ctx = c.getContext("2d");
        ctx.drawImage(videoEl, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.5));
      } catch(e) { reject(e); }
    };
    videoEl.addEventListener("seeked", onSeeked);
    videoEl.currentTime = timeSec;
  });
}

async function aiMoodQuery(dataUrl, scriptText) {
  if (!API_KEY) throw new Error("no key");
  const prompt = `这是短剧某一BGM段的中间画面截图。\n剧本片段：\n${scriptText.slice(0, 800)}\n\n任务：根据画面里主角的表情、动作、氛围，用15-25个英文单词描述这段应该配什么BGM情绪和风格。要求：\n1. 贴主角内心情绪（tense/relieved/determined/warm/angry/sad/vulnerable/triumphant/suspenseful等）\n2. 纯器乐，无人声（instrumental, no vocals）\n3. 只输出英文query一行`;

function parseTimepoints(str, totalDur) {
  const parts = str.split(/[,，;；]/).map(s=>s.trim()).filter(Boolean);
  const segs = [];
  for (const p of parts) {
    const m = p.match(/(\d+(?:\.\d+)?)\s*[-–~]\s*(\d+(?:\.\d+)?)/);
    if (!m) continue;
    segs.push({ start: parseFloat(m[1]), end: parseFloat(m[2]) });
  }
  if (!segs.length) return null;
  if (segs[segs.length-1].end < totalDur - 1) segs[segs.length-1].end = totalDur;
  if (segs[0].start > 0) segs[0].start = 0;
  return segs;
}

async function detectScenes(file, onProgress) {
  return new Promise((resolve) => {
    const video = document.createElement("video");
    video.preload = "auto"; video.muted = true; video.playsInline = true;
    video.src = URL.createObjectURL(file);
    const W = 160, H = 90;
    const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const STEP = 0.6, THRESHOLD = 38, MIN_GAP = 3.0;
    video.onloadedmetadata = async () => {
      const dur = video.duration;
      const times = [];
      for (let t = 0.5; t < dur - 0.3; t += STEP) times.push(t);
      let prevData = null;
      const cuts = [0];
      for (let i = 0; i < times.length; i++) {
        const t = times[i];
        await new Promise(r => {
          video.currentTime = t;
          video.onseeked = () => {
            ctx.drawImage(video, 0, 0, W, H);
            const d = ctx.getImageData(0, 0, W, H).data;
            if (prevData) {
              let sum = 0, n = d.length / 4;
              for (let j = 0; j < d.length; j += 4) {
                const dr = d[j] - prevData[j], dg = d[j+1] - prevData[j+1], db = d[j+2] - prevData[j+2];
                sum += dr*dr + dg*dg + db*db;
              }
              if (sum/(n*3) > THRESHOLD) { const lastCut = cuts[cuts.length-1]; if (t - lastCut > MIN_GAP) cuts.push(t); }
            }
            prevData = d;
            onProgress && onProgress((i+1)/times.length, t);
            r();
          };
        });
      }
      cuts.push(dur);
      resolve(cuts);
    };
  });
}

function mergeShortSegments(cuts, totalDur) {
  let pts = [...cuts];
  const MIN_SEG = 4.0, MAX_SEGS = 15;
  while (pts.length > 2) {
    let shortestIdx = 1, shortestLen = Infinity;
    for (let i=1;i<pts.length;i++) { const len = pts[i]-pts[i-1]; if (len<shortestLen) { shortestLen=len; shortestIdx=i; } }
    if (shortestLen >= MIN_SEG && pts.length-1 <= MAX_SEGS) break;
    pts.splice(shortestIdx, 1);
  }
  return pts;
}

function norm(a) { let s=0; for (const x of a) s+=x*x; s=Math.sqrt(s)||1; return a.map(x=>x/s); }
function parseScenes(text) {
  const lines = text.split("\n"); const scenes = []; let cur = null;
  const re = /(\d{1,3}-\d{1,3})/;
  for (const line of lines) {
    const m = line.match(re);
    if (m) { if (cur) scenes.push(cur); cur = {id:m[1], text:line}; }
    else if (cur) cur.text += "\n"+line;

  if (cur) scenes.push(cur); return scenes;
}

function sliceBuffer(buf, off, dur) {
  const ctx = getCtx();
  const offS = Math.max(0, off);
  const take = Math.min(dur, Math.max(0.1, buf.duration - offS));
  const len = Math.max(0, Math.floor(take*buf.sampleRate));
  const out = ctx.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
  for (let ch=0; ch<buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch); const o = out.getChannelData(ch);
    for (let i=0;i<len;i++) o[i] = d[Math.floor(offS*buf.sampleRate)+i];
  }
  return out;
}

async function crossfadeConcatAsync(bufs, overlap) {
  overlap = overlap || CROSSFADE_SEC;
  if (bufs.length===0) return null;
  if (bufs.length===1) return bufs[0];
  const ctx = getCtx();
  let result = bufs[0];
  for (let i=1;i<bufs.length;i++) {
    const b = bufs[i];
    const ov = Math.min(overlap, result.duration/2, b.duration/2);
    const totalLen = Math.floor((result.duration + b.duration - ov) * result.sampleRate);
    const out = ctx.createBuffer(result.numberOfChannels, totalLen, result.sampleRate);
    for (let ch=0; ch<out.numberOfChannels; ch++) {
      const rd = result.getChannelData(ch); const od = b.getChannelData(ch); const wd = out.getChannelData(ch);
      for (let j=0;j<rd.length;j++) wd[j] = rd[j];
      const ovLen = Math.floor(ov*result.sampleRate);
      const ovStart = rd.length - ovLen;
      for (let j=0;j<ovLen;j++) {
        const fo = Math.cos((j/ovLen)*Math.PI/2);
        const fi = Math.sin((j/ovLen)*Math.PI/2);
        wd[ovStart+j] = rd[ovStart+j]*fo + od[j]*fi;
      }
      const bStart = Math.floor(ov*b.sampleRate);
      for (let j=bStart;j<od.length;j++) wd[rd.length - ovLen + (j-bStart)] = od[j];
    }
    result = out;
    await yieldUI();
  }
  return result;
}

async function buildSegmentBuffer(seg, neededDur) {
  const pieces = []; let filled = 0; const used = new Set();
  for (let i=0; i<seg.candidates.length && filled < neededDur; i++) {
    const c = seg.candidates[i];
    if (used.has(c.fn)) continue;
    const fh = SONG_MAP[c.fn.toLowerCase()];
    if (!fh) continue;
    try {
      const full = await decodeAudioFile(fh);
      const remain = neededDur - filled;
      const piece = sliceBuffer(full, seg.srcStart, remain + CROSSFADE_SEC);
      pieces.push(piece); filled += piece.duration; used.add(c.fn);
    } catch(e) { console.warn("decode fail", c.fn, e); }
    await yieldUI();
  }
  if (!pieces.length) return null;
  if (pieces.length === 1) return pieces[0];
  return crossfadeConcatAsync(pieces, 1.5);
}

function alignToDuration(buf, targetDur) {
  const ctx = getCtx();
  const targetLen = Math.round(targetDur * buf.sampleRate);
  if (buf.length === targetLen) return buf;
  if (buf.length > targetLen) {
    const out = ctx.createBuffer(buf.numberOfChannels, targetLen, buf.sampleRate);
    for (let ch=0; ch<buf.numberOfChannels; ch++) out.copyToChannel(buf.getChannelData(ch).subarray(0, targetLen), ch);
    return out;
  }
  const out = ctx.createBuffer(buf.numberOfChannels, targetLen, buf.sampleRate);
  for (let ch=0; ch<buf.numberOfChannels; ch++) out.getChannelData(ch).set(buf.getChannelData(ch), 0);
  return out;
}

function bufferToMp3(buf, kbps) {
  kbps = kbps || 192;
  const numCh = Math.min(2, buf.numberOfChannels);
  const enc = new lamejs.Mp3Encoder(numCh, buf.sampleRate, kbps);
  const left = buf.getChannelData(0);
  const right = numCh === 2 ? buf.getChannelData(1) : null;
  const blockSize = 1152; const samples = buf.length; const out = [];
  for (let i=0; i<samples; i+=blockSize) {
    const lc = new Int16Array(blockSize);
    const rc = numCh === 2 ? new Int16Array(blockSize) : null;
    for (let j=0;j<blockSize && i+j<samples;j++) {
      const l = Math.max(-1, Math.min(1, left[i+j]));
      lc[j] = l<0 ? l*0x8000 : l*0x7FFF;
      if (rc) { const r = Math.max(-1, Math.min(1, right[i+j])); rc[j] = r<0 ? r*0x8000 : r*0x7FFF; }
    }
    const mp3buf = numCh === 2 ? enc.encodeBuffer(lc, rc) : enc.encodeBuffer(lc);
    if (mp3buf.length > 0) out.push(new Uint8Array(mp3buf));
  }
  const end = enc.flush();
  if (end.length > 0) out.push(new Uint8Array(end));
  return new Blob(out, {type:"audio/mp3"});
}

function bufferToWav(buf) {
  const numCh = buf.numberOfChannels, sampleRate = buf.sampleRate;
  const bytesPerSample = 2;
  const length = buf.length * numCh * bytesPerSample;
  const ab = new ArrayBuffer(44 + length);
  const view = new DataView(ab);
  const writeStr = (off, s) => { for(let i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); };
  writeStr(0, "RIFF"); view.setUint32(4, 36+length, true); writeStr(8, "WAVE");
  writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true); view.setUint16(24, sampleRate, true);
  view.setUint16(28, sampleRate*numCh*bytesPerSample, true);
  view.setUint16(32, numCh*bytesPerSample, true); view.setUint16(34, 16, true);
  writeStr(36, "data"); view.setUint32(40, length, true);
  let off = 44;
  for (let i=0;i<buf.length;i++) for (let ch=0;ch<numCh;ch++) {
    let s = Math.max(-1, Math.min(1, buf.getChannelData(ch)[i]));
    view.setInt16(off, s<0?s*0x8000:s*0x7FFF, true); off += 2;
  }
  return new Blob([ab], {type:"audio/wav"});
}

function applyFade(buf, fadeIn, fadeOut) {
  const sr = buf.sampleRate;
  const fiLen = Math.floor(fadeIn*sr), foLen = Math.floor(fadeOut*sr);
  for (let ch=0; ch<buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    for (let i=0;i<fiLen && i<d.length;i++) d[i] *= i/fiLen;
    for (let i=0;i<foLen && i<d.length;i++) d[d.length-1-i] *= i/foLen;
  }
}

document.getElementById("exportAllBtn").onclick = async () => {
  if (!STATE.segments.length) { alert("请先分析"); return; }
  stopPreview();
  const bar = document.getElementById("pbar");
  const st = document.getElementById("status");
  try {
    const bufs = [];
    for (let i=0;i<STATE.segments.length;i++) {
      const s = STATE.segments[i];
      setProgress(bar, Math.round((i/STATE.segments.length)*75), `构建段${i+1}/${STATE.segments.length}`);
      const segBuf = await buildSegmentBuffer(s, s.srcDur);
      if (segBuf) bufs.push(segBuf);
      await yieldUI();
    }
    setProgress(bar, 82, `crossfade ${CROSSFADE_SEC}s...`);
    await yieldUI();
    const mixed = await crossfadeConcatAsync(bufs, CROSSFADE_SEC);
    const beforeDur = mixed.duration;
    setProgress(bar, 90, `对齐时长（${beforeDur.toFixed(1)}s → ${STATE.duration.toFixed(1)}s）...`);
    await yieldUI();
    const aligned = alignToDuration(mixed, STATE.duration);
    applyFade(aligned, FADE_IN, FADE_OUT);
    let blob, ext;
    if (EXPORT_FMT === "mp3") {
      setProgress(bar, 95, "编码MP3中（5-15秒，期间页面暂时无响应）...");
      await yieldUI();
      blob = bufferToMp3(aligned, 192); ext = "mp3";
    } else {
      setProgress(bar, 95, "打包WAV...");
      blob = bufferToWav(aligned); ext = "wav";
    }
    const fname = `BGM_${STATE.duration.toFixed(0)}s.${ext}`;
    const alignNote = Math.abs(beforeDur-STATE.duration)>0.5 ? `，已${beforeDur>STATE.duration?"裁剪":"补静音"}${Math.abs(beforeDur-STATE.duration).toFixed(2)}s` : "";
    if (OUT_DIR) {
      const w = await OUT_DIR.getFileHandle(fname, {create:true});
      const w2 = await w.createWritable();
      await w2.write(blob); await w2.close();
      st.textContent = `✅ 已导出到 ${OUT_DIR.name}/${fname}\n时长: ${aligned.duration.toFixed(2)}s（视频${STATE.duration.toFixed(2)}s）\n拼接前${beforeDur.toFixed(2)}s${alignNote}`;
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fname; a.click();
      st.textContent = `✅ 已导出 ${fname}\n时长: ${aligned.duration.toFixed(2)}s（视频${STATE.duration.toFixed(2)}s）\n拼接前${beforeDur.toFixed(2)}s${alignNote}`;
    }
    setProgress(bar, 100, "完成");
  } catch(e) {
    console.error(e);
    st.textContent = `❌ 导出失败：${e.message}`;
    setProgress(bar, 100, "错误");
  }
};

function fmt(t) { t=Math.max(0,t|0); return `${(t/60)|0}:${String(t%60).padStart(2,'0')}`; }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BGM工作台</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #222; }
h1 { text-align: center; padding: 16px; font-size: 22px; }
.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 16px; }
.row { display: grid; grid-template-columns: 1fr 1.2fr 1.2fr; gap: 12px; padding: 0 16px 16px; }
.col { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.col h3 { font-size: 14px; margin-bottom: 8px; }
textarea, input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
textarea { min-height: 180px; resize: vertical; }
button { padding: 8px 14px; border: none; border-radius: 4px; background: #4f46e5; color: #fff; cursor: pointer; font-size: 13px; margin-top: 8px; margin-right: 6px; }
button:hover { background: #4338ca; }
button:disabled { background: #ccc; cursor: not-allowed; }
button.secondary { background: #6b7280; }
button.green { background: #059669; }
button.teal { background: #0d9488; }
.seg { padding: 8px; border: 1px solid #e5e7eb; border-radius: 4px; margin-bottom: 6px; cursor: pointer; font-size: 12px; }
.seg:hover { background: #f3f4f6; }
.seg.active { border-color: #4f46e5; background: #eef2ff; }
.mood { display: inline-block; background: #e0e7ff; color: #4338ca; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-left: 4px; }
.status { font-size: 12px; color: #666; margin-top: 8px; white-space: pre-wrap; }
.song { font-size: 12px; padding: 4px; background: #f9fafb; border-radius: 3px; margin-bottom: 3px; cursor: pointer; }
.song.sel { background: #dbeafe; }
.fileinfo { font-size: 12px; color: #059669; margin-top: 4px; }
.banner { background: #fef3c7; padding: 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; color: #92400e; }
.player { margin-top: 10px; padding: 10px; background: #f9fafb; border-radius: 6px; }
.player .time { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-top: 4px; }
input[type=range] { width: 100%; margin-top: 6px; }
.pbar-wrap { margin-top: 10px; background: #e5e7eb; border-radius: 6px; overflow: hidden; height: 18px; display:none; }
.pbar { height: 100%; background: linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; font-size:11px; line-height:18px; text-align:center; transition: width .3s; white-space:nowrap; }
.musiclib { max-height: 300px; overflow-y: auto; margin-top: 8px; }
.api-box { background:#fff; border-radius:8px; padding:10px 16px; margin:0 16px 12px; display:flex; gap:8px; align-items:center; box-shadow:0 1px 3px rgba(0,0,0,.08); flex-wrap:wrap; }
.api-box label { font-size:12px; color:#666; white-space:nowrap; }
.api-box input { flex:1; font-size:12px; min-width:200px; }
.api-msg { font-size:12px; margin-left:8px; }
.api-msg.ok { color:#059669; }
.api-msg.err { color:#dc2626; }
.export-btn { width:100%; padding:12px; font-size:15px; margin-top:12px; background:#059669; }
@media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>🎬 BGM 工作台</h1>
<div class="sub">纯前端 · 选音乐库 → 粘贴剧本 → 自动选曲 → 导出WAV</div>

<div class="api-box">
  <label>🔑 阿里云API Key:</label>
  <input type="password" id="apiKey" placeholder="sk-... （存在浏览器本地，不上传）">
  <button id="saveKeyBtn" class="secondary" style="margin-top:0;">保存</button>
  <button id="testKeyBtn" class="teal" style="margin-top:0;">🔌 测试连接</button>
  <span id="apiMsg" class="api-msg"></span>
</div>

<div style="padding:0 16px 12px; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
  <div class="col" style="padding:10px;">
    <b>① 音乐库文件夹</b>
    <div class="banner">先选文件夹，再点分析音乐库建立索引。</div>
    <button id="pickBtn">📁 选择音乐文件夹</button>
    <button id="analyzeLibBtn" class="teal" disabled>🎵 分析音乐库</button>
    <div id="fileInfo" class="fileinfo">未选择</div>
    <div class="pbar-wrap" id="libPbarWrap"><div class="pbar" id="libPbar" style="width:0%">0%</div></div>
    <div id="libList" class="musiclib"></div>
  </div>
  <div class="col" style="padding:10px;">
    <b>导出位置</b>
    <div class="banner">选BGM导出到哪个文件夹。</div>
    <button id="pickOutBtn" class="secondary">📂 选择导出文件夹</button>
    <div id="outInfo" class="fileinfo">未选（默认浏览器下载）</div>
  </div>
</div>

<div class="row">
  <div class="col">
    <h3>② 剧本 + 视频</h3>
    <textarea id="script" placeholder="粘贴整集剧本（含 41-1、41-2 等场号）"></textarea>
    <input type="file" id="video" accept="video/*" style="margin-top:8px;">
    <button id="analyzeBtn" disabled>🔍 分析并自动选曲</button>
    <button id="exportAllBtn" class="export-btn green" disabled>💾 导出整集BGM (WAV)</button>
    <div class="pbar-wrap" id="pbarWrap"><div class="pbar" id="pbar" style="width:0%">0%</div></div>
    <div id="status" class="status"></div>
  </div>
  <div class="col">
    <h3>③ 情绪弧线</h3>
    <div id="segList"><div style="color:#aaa;font-size:12px;">分析后显示分段</div></div>
  </div>
  <div class="col">
    <h3>④ 段详情 / 试听</h3>
    <div id="detail"><div style="color:#aaa;font-size:12px;">点中间段查看</div></div>
  </div>
</div>

<script>
let EMB = [], SONG_MAP = {}, OUT_DIR = null;
let curAudio = null;
let LIB_READY = false;
let API_KEY = localStorage.getItem("dashscope_key") || "";
let STATE = { segments: [], cur: 0, duration: 0 };
let actx = null;

const MOOD_MAP = {
  "紧张/对峙": ["紧张 对峙 压迫 危险 黑暗 悬疑 thriller tension"],
  "打斗/爆发": ["激烈 动作 打斗 高潮 节奏快 鼓点 action fight drums"],
  "悲伤/委屈": ["悲伤 委屈 难过 钢琴 孤独 催泪 sad piano emotional"],
  "温暖/治愈": ["温暖 治愈 家庭 亲情 弦乐 感人 warm healing family"],
  "愤怒/反击": ["愤怒 反击 冲突 爆发 沉重 angry revenge dramatic"],
  "冷静/霸气": ["冷静 霸气 坚定 王者 沉稳 史诗 powerful epic calm"],
  "惊喜/发现": ["惊喜 发现 奇迹 升华 梦幻 wonder magical discovery"],
  "阴谋/悬疑": ["阴谋 悬疑 神秘 低沉 诡异 紧张 mysterious conspiracy dark"],
  "回忆/怀旧": ["回忆 怀旧 怀念 钢琴 伤感 时光 nostalgic memory piano"],
  "温馨/日常": ["温馨 日常 轻松 吉他 平和 乡村 warm daily light acoustic"],
};

function getCtx() { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }

document.getElementById("apiKey").value = API_KEY;
document.getElementById("saveKeyBtn").onclick = () => {
  API_KEY = document.getElementById("apiKey").value.trim();
  localStorage.setItem("dashscope_key", API_KEY);
  document.getElementById("apiMsg").textContent = "✅ 已保存";
  document.getElementById("apiMsg").className = "api-msg ok";
};

document.getElementById("testKeyBtn").onclick = async () => {
  const msg = document.getElementById("apiMsg");
  const key = document.getElementById("apiKey").value.trim();
  if (!key) { msg.textContent = "⚠️ 请先填Key"; msg.className = "api-msg err"; return; }
  msg.textContent = "⏳ 测试中..."; msg.className = "api-msg";
  try {
    const r = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings", {
      method: "POST",
      headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
      body: JSON.stringify({ model: "text-embedding-v3", input: ["test"], dimensions: 1024, encoding_format: "float" })
    });
    if (!r.ok) { const e = await r.json().catch(()=>({error:{message:r.statusText}})); throw new Error(e.error?.message || r.status); }
    const j = await r.json();
    const dim = j.data?.[0]?.embedding?.length;
    msg.textContent = `✅ 连接成功（向量维度 ${dim}）`;
    msg.className = "api-msg ok";
  } catch(e) {
    msg.textContent = `❌ 失败：${e.message}`;
    msg.className = "api-msg err";
  }
};

function setProgress(el, pct, text) {
  el.parentElement.style.display = "block";
  el.style.width = pct + "%";
  el.textContent = `${pct}% ${text||""}`;
}

async function loadEmb() {
  try {
    const r = await fetch("web_embeddings.json");
    EMB = await r.json();
    console.log("loaded embeddings:", EMB.length);
  } catch(e) { console.error(e); }
}
loadEmb();

async function scanDir(dirHandle, map) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "directory") await scanDir(entry, map);
    else if (entry.kind === "file" && /\.(mp3|wav|m4a|ogg|flac)$/i.test(entry.name)) map[entry.name.toLowerCase()] = entry;
  }
}

document.getElementById("pickBtn").onclick = async () => {
  try {
    const h = await window.showDirectoryPicker();
    SONG_MAP = {};
    document.getElementById("fileInfo").textContent = "扫描中...";
    await scanDir(h, SONG_MAP);
    document.getElementById("fileInfo").textContent = `已选：${h.name}（${Object.keys(SONG_MAP).length} 首）`;
    document.getElementById("analyzeLibBtn").disabled = false;
  } catch(e) {}
};

document.getElementById("analyzeLibBtn").onclick = async () => {
  const n = Object.keys(SONG_MAP).length;
  if (!n) { alert("先选文件夹"); return; }
  const bar = document.getElementById("libPbar");
  setProgress(bar, 5, "匹配向量库...");
  await new Promise(r=>setTimeout(r,200));
  let matched = 0, list = [];
  for (const e of EMB) {
    if (e.voc === "yes") continue;
    if (SONG_MAP[e.fn.toLowerCase()]) { matched++; list.push(e.fn); }
  }
  setProgress(bar, 100, `完成：匹配 ${matched}/${EMB.filter(e=>e.voc!=='yes').length} 首纯器乐`);
  document.getElementById("status").textContent = `音乐库就绪：本地${n}首，可搜纯器乐${matched}首`;
  const lv = document.getElementById("libList");
  lv.innerHTML = list.slice(0,50).map(f=>`<div class="song">🎵 ${f}</div>`).join("") + (list.length>50?`<div style="color:#888;font-size:11px;padding:4px;">...共${list.length}首</div>`:"");
  LIB_READY = true;
  document.getElementById("analyzeBtn").disabled = false;
};

document.getElementById("pickOutBtn").onclick = async () => {
  try {
    OUT_DIR = await window.showDirectoryPicker();
    document.getElementById("outInfo").textContent = `导出到：${OUT_DIR.name}`;
  } catch(e) {}
};

async function embedText(text) {
  if (!API_KEY) { alert("请先填阿里云API Key"); throw new Error("no key"); }
  const r = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings", {
    method: "POST",
    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify({ model: "text-embedding-v3", input: [text], dimensions: 1024, encoding_format: "float" })
  });
  const j = await r.json();
  return j.data[0].embedding;
}

function decodeVec(b64) {
  const bin = atob(b64);
  const arr = new Float32Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = (bin.charCodeAt(i) - 128) / 127;
  return arr;
}

// 解码音频文件为 AudioBuffer
async function decodeAudioFile(fileHandle) {
  const file = await fileHandle.getFile();
  const buf = await file.arrayBuffer();
  const ctx = getCtx();
  return await ctx.decodeAudioData(buf);
}

document.getElementById("analyzeBtn").onclick = async () => {
  if (!LIB_READY) { alert("请先点【分析音乐库】"); return; }
  const script = document.getElementById("script").value;
  const vf = document.getElementById("video").files[0];
  if (!script || !vf) { alert("请填剧本+选视频"); return; }
  const st = document.getElementById("status");
  const bar = document.getElementById("pbar");
  setProgress(bar, 5, "探测视频时长");
  const dur = await probeDuration(vf);
  STATE.duration = dur;
  const scenes = parseScenes(script);
  const n = scenes.length || 1;
  const segLen = dur / n;

  STATE.segments = [];
  for (let i=0;i<scenes.length;i++) {
    const text = scenes[i].text;
    // 情绪判断
    let mood = "温馨/日常";
    if (/打|杀|爆|怒|吼|冲|摔|撕|逼|威胁/.test(text)) mood = "愤怒/反击";
    if (/哭|泪|委屈|心酸|疼|心碎|难/.test(text)) mood = "悲伤/委屈";
    if (/紧张|对峙|压|危险|恐|抖|惊/.test(text)) mood = "紧张/对峙";
    if (/暖|笑|开心|幸福|团圆|亲|家|温馨/.test(text)) mood = "温暖/治愈";
    if (/阴谋|神秘|诡异|暗|沉|黑/.test(text)) mood = "阴谋/悬疑";
    if (/回忆|从前|当年|旧|怀念/.test(text)) mood = "回忆/怀旧";
    const query = MOOD_MAP[mood][0];
    const pct = 10 + Math.round((i/n)*85);
    setProgress(bar, pct, `场${scenes[i].id} 搜曲中 (${i+1}/${n})`);
    const q = await embedText(query);
    const qn = norm(q);
    let scores = EMB.filter(e => e.voc !== "yes" && SONG_MAP[e.fn.toLowerCase()]).map(e => {
      const en = norm(decodeVec(e.v));
      let s = 0; for (let j=0;j<qn.length;j++) s += qn[j]*en[j];
      return {sim: s, fn: e.fn};
    });
    scores.sort((a,b)=>b.sim-a.sim);
    STATE.segments.push({ id: scenes[i].id, timeStart: i*segLen, timeEnd: (i+1)*segLen, mood, candidates: scores.slice(0,10), track: 0, srcStart: 2, srcDur: segLen+2 });
  }
  setProgress(bar, 100, "完成");
  renderSegList();
  st.textContent = `✅ 完成！共${n}段，视频${dur.toFixed(1)}秒。点中间段查看，最后点导出整集BGM。`;
  document.getElementById("exportAllBtn").disabled = false;
};

function norm(a) { let s=0; for (const x of a) s+=x*x; s=Math.sqrt(s)||1; return a.map(x=>x/s); }
function parseScenes(text) {
  const lines = text.split("\n"); const scenes = []; let cur = null;
  const re = /(\d{1,3}-\d{1,3})/;
  for (const line of lines) {
    const m = line.match(re);
    if (m) { if (cur) scenes.push(cur); cur = {id: m[1], text: line}; }
    else if (cur) cur.text += "\n"+line;
  }
  if (cur) scenes.push(cur); return scenes;
}
function probeDuration(file) {
  return new Promise(res => { const v = document.createElement("video"); v.preload="metadata"; v.onloadedmetadata=()=>res(v.duration); v.src=URL.createObjectURL(file); });
}
function renderSegList() {
  const el = document.getElementById("segList"); el.innerHTML = "";
  STATE.segments.forEach((s,i) => {
    const d = document.createElement("div");
    d.className = "seg" + (i===STATE.cur?" active":"");
    d.innerHTML = `<b>${s.id}</b> <span class="mood">${s.mood}</span><br><span style="color:#666;font-size:11px;">${s.candidates[s.track].fn.slice(0,35)}</span>`;
    d.onclick = () => { STATE.cur = i; renderSegList(); renderDetail(); };
    el.appendChild(d);
  });
}

async function renderDetail() {
  const s = STATE.segments[STATE.cur]; if (!s) return;
  if (curAudio) { curAudio.pause(); curAudio = null; }
  const el = document.getElementById("detail");
  const cur = s.candidates[s.track];
  el.innerHTML = `<b>段 ${s.id}</b> <span class="mood">${s.mood}</span><br>
    <div class="song sel">${cur.fn} (相似度${cur.sim.toFixed(2)})</div>
    <div style="margin-top:8px;">
      <label style="font-size:12px;">素材起始: <input type="number" id="st" value="${s.srcStart.toFixed(1)}" step="0.5" style="width:70px;">秒</label>
      <label style="font-size:12px;">素材时长: <input type="number" id="dur" value="${s.srcDur.toFixed(1)}" step="0.5" style="width:70px;">秒</label>
    </div>
    <div id="cands" style="margin-top:8px;"></div>
    <button id="previewBtn">▶ 播放</button>
    <button id="pauseBtn" class="secondary">⏸ 暂停</button>
    <div class="player">
      <input type="range" id="seekBar" min="0" max="100" value="0">
      <div class="time"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>`;
  const cands = document.getElementById("cands");
  s.candidates.forEach((c,i) => {
    const d = document.createElement("div");
    d.className = "song" + (i===s.track?" sel":"");
    d.textContent = `[${i}] ${c.fn.slice(0,40)} (${c.sim.toFixed(2)})`;
    d.onclick = () => { s.track = i; renderDetail(); };
    cands.appendChild(d);
  });
  document.getElementById("previewBtn").onclick = async () => {
    s.srcStart = parseFloat(document.getElementById("st").value);
    s.srcDur = parseFloat(document.getElementById("dur").value);
    const fh = SONG_MAP[cur.fn.toLowerCase()];
    if (!fh) { alert("找不到文件："+cur.fn); return; }
    if (curAudio) curAudio.pause();
    try {
      const buf = await decodeAudioFile(fh);
      const ctx = getCtx();
      const off = s.srcStart, dur = Math.min(s.srcDur, buf.duration - off);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const gain = ctx.createGain();
      src.connect(gain).connect(ctx.destination);
      src.start(0, off, dur);
      curAudio = src;
      const bar = document.getElementById("seekBar");
      document.getElementById("durTime").textContent = fmt(dur);
      const t0 = ctx.currentTime;
      const timer = setInterval(() => {
        const t = ctx.currentTime - t0;
        bar.value = (t/dur)*100;
        document.getElementById("curTime").textContent = fmt(t);
        if (t >= dur) { clearInterval(timer); curAudio = null; }
      }, 100);
    } catch(e) { alert("解码失败："+e.message); }
  };
  document.getElementById("pauseBtn").onclick = () => { if (!curAudio) return; try { curAudio.stop(); curAudio = null; } catch(e){} };
}

// 把一段 AudioBuffer 按 off/dur 裁剪到新 buffer
function sliceBuffer(buf, off, dur) {
  const ctx = getCtx();
  const offS = Math.max(0, off), endS = Math.min(buf.duration, off+dur);
  const len = Math.max(0, Math.floor((endS-offS)*buf.sampleRate));
  const out = ctx.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
  for (let ch=0; ch<buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    const o = out.getChannelData(ch);
    for (let i=0;i<len;i++) o[i] = d[Math.floor(offS*buf.sampleRate)+i];
  }
  return out;
}

// 两段buffer crossfade混合（overlap秒）
function crossfadeConcat(bufs, overlap=2.0) {
  if (bufs.length===0) return null;
  if (bufs.length===1) return bufs[0];
  const ctx = getCtx();
  let result = bufs[0];
  for (let i=1;i<bufs.length;i++) {
    const b = bufs[i];
    const ov = Math.min(overlap, result.duration/2, b.duration/2);
    const totalLen = Math.floor((result.duration + b.duration - ov) * result.sampleRate);
    const out = ctx.createBuffer(result.numberOfChannels, totalLen, result.sampleRate);
    for (let ch=0; ch<out.numberOfChannels; ch++) {
      const rd = result.getChannelData(ch);
      const od = b.getChannelData(ch);
      const wd = out.getChannelData(ch);
      // 前半：result原样
      for (let j=0;j<rd.length;j++) wd[j] = rd[j];
      // overlap区：crossfade
      const ovStart = rd.length - Math.floor(ov*result.sampleRate);
      const ovLen = Math.floor(ov*result.sampleRate);
      for (let j=0;j<ovLen;j++) {
        const fadeOut = Math.cos((j/ovLen)*Math.PI/2); // 1->0
        const fadeIn = Math.sin((j/ovLen)*Math.PI/2);   // 0->1
        wd[ovStart+j] = rd[ovStart+j]*fadeOut + od[j]*fadeIn;
      }
      // 后半：b剩余
      const bStart = Math.floor(ov*b.sampleRate);
      for (let j=bStart;j<od.length;j++) wd[rd.length - ovLen + (j-bStart)] = od[j];
    }
    result = out;
  }
  return result;
}

// AudioBuffer -> WAV blob
function bufferToWav(buf) {
  const numCh = buf.numberOfChannels;
  const sampleRate = buf.sampleRate;
  const bytesPerSample = 2;
  const length = buf.length * numCh * bytesPerSample;
  const ab = new ArrayBuffer(44 + length);
  const view = new DataView(ab);
  const writeStr = (off, s) => { for(let i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); };
  writeStr(0, "RIFF");
  view.setUint32(4, 36+length, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate*numCh*bytesPerSample, true);
  view.setUint16(32, numCh*bytesPerSample, true);
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, length, true);
  let off = 44;
  for (let i=0;i<buf.length;i++) {
    for (let ch=0;ch<numCh;ch++) {
      let s = Math.max(-1, Math.min(1, buf.getChannelData(ch)[i]));
      view.setInt16(off, s<0?s*0x8000:s*0x7FFF, true);
      off += 2;
    }
  }
  return new Blob([ab], {type:"audio/wav"});
}

document.getElementById("exportAllBtn").onclick = async () => {
  if (!STATE.segments.length) { alert("请先分析"); return; }
  const bar = document.getElementById("pbar");
  const st = document.getElementById("status");
  st.textContent = "解码并裁剪每段音频...";
  const bufs = [];
  for (let i=0;i<STATE.segments.length;i++) {
    const s = STATE.segments[i];
    const cur = s.candidates[s.track];
    const fh = SONG_MAP[cur.fn.toLowerCase()];
    if (!fh) { st.textContent = `跳过${s.id}（找不到文件）`; continue; }
    setProgress(bar, Math.round((i/STATE.segments.length)*90), `解码${s.id}`);
    const full = await decodeAudioFile(fh);
    const clipped = sliceBuffer(full, s.srcStart, s.srcDur);
    bufs.push(clipped);
  }
  setProgress(bar, 92, "crossfade拼接...");
  await new Promise(r=>setTimeout(r,100));
  const mixed = crossfadeConcat(bufs, 2.0);
  // 开头2秒淡入，结尾2秒淡出
  applyFade(mixed, 2.0, 2.0);
  setProgress(bar, 97, "导出WAV...");
  const blob = bufferToWav(mixed);
  const fname = `BGM_${STATE.duration.toFixed(0)}s.wav`;
  if (OUT_DIR) {
    const w = await OUT_DIR.getFileHandle(fname, {create:true});
    const w2 = await w.createWritable();
    await w2.write(blob);
    await w2.close();
    st.textContent = `✅ 已导出到 ${OUT_DIR.name}/${fname}`;
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    st.textContent = `✅ 已导出 ${fname}（${mixed.duration.toFixed(1)}秒）`;
  }
  setProgress(bar, 100, "完成");
};

function applyFade(buf, fadeIn, fadeOut) {
  const sr = buf.sampleRate;
  const fiLen = Math.floor(fadeIn*sr), foLen = Math.floor(fadeOut*sr);
  for (let ch=0; ch<buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    for (let i=0;i<fiLen && i<d.length;i++) d[i] *= i/fiLen;
    for (let i=0;i<foLen && i<d.length;i++) d[d.length-1-i] *= i/foLen;
  }
}

function fmt(t) { t=Math.max(0,t|0); return `${(t/60)|0}:${String(t%60).padStart(2,'0')}`; }

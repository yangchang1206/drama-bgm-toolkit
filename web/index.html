<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BGM工作台</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #222; }
h1 { text-align: center; padding: 16px; font-size: 22px; }
.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 16px; }
.row { display: grid; grid-template-columns: 1fr 1.2fr 1.2fr; gap: 12px; padding: 0 16px 16px; }
.col { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.col h3 { font-size: 14px; margin-bottom: 8px; }
textarea, input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
textarea { min-height: 180px; resize: vertical; }
button { padding: 8px 14px; border: none; border-radius: 4px; background: #4f46e5; color: #fff; cursor: pointer; font-size: 13px; margin-top: 8px; margin-right: 6px; }
button:hover { background: #4338ca; }
button:disabled { background: #ccc; cursor: not-allowed; }
button.secondary { background: #6b7280; }
button.green { background: #059669; }
button.teal { background: #0d9488; }
.seg { padding: 8px; border: 1px solid #e5e7eb; border-radius: 4px; margin-bottom: 6px; cursor: pointer; font-size: 12px; }
.seg:hover { background: #f3f4f6; }
.seg.active { border-color: #4f46e5; background: #eef2ff; }
.mood { display: inline-block; background: #e0e7ff; color: #4338ca; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-left: 4px; }
.status { font-size: 12px; color: #666; margin-top: 8px; white-space: pre-wrap; }
.song { font-size: 12px; padding: 4px; background: #f9fafb; border-radius: 3px; margin-bottom: 3px; cursor: pointer; }
.song.sel { background: #dbeafe; }
.fileinfo { font-size: 12px; color: #059669; margin-top: 4px; }
.banner { background: #fef3c7; padding: 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; color: #92400e; }
.player { margin-top: 10px; padding: 10px; background: #f9fafb; border-radius: 6px; }
.player .time { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-top: 4px; }
input[type=range] { width: 100%; margin-top: 6px; }
.pbar-wrap { margin-top: 10px; background: #e5e7eb; border-radius: 6px; overflow: hidden; height: 18px; display:none; }
.pbar { height: 100%; background: linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; font-size:11px; line-height:18px; text-align:center; transition: width .3s; white-space:nowrap; }
.musiclib { max-height: 300px; overflow-y: auto; margin-top: 8px; }
.api-box { background:#fff; border-radius:8px; padding:10px 16px; margin:0 16px 12px; display:flex; gap:8px; align-items:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.api-box label { font-size:12px; color:#666; white-space:nowrap; }
.api-box input { flex:1; font-size:12px; }
@media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>🎬 BGM 工作台</h1>
<div class="sub">纯前端 · 选音乐库 → 粘贴剧本 → 自动选曲 → 导出MP3</div>

<div class="api-box">
  <label>🔑 阿里云API Key:</label>
  <input type="password" id="apiKey" placeholder="sk-... （存在浏览器本地，不上传）">
  <button id="saveKeyBtn" class="secondary" style="margin-top:0;">保存</button>
</div>

<div style="padding:0 16px 12px; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
  <div class="col" style="padding:10px;">
    <b>① 音乐库文件夹</b>
    <div class="banner">先选文件夹，再点分析音乐库建立索引。</div>
    <button id="pickBtn">📁 选择音乐文件夹</button>
    <button id="analyzeLibBtn" class="teal" disabled>🎵 分析音乐库</button>
    <div id="fileInfo" class="fileinfo">未选择</div>
    <div class="pbar-wrap" id="libPbarWrap"><div class="pbar" id="libPbar" style="width:0%">0%</div></div>
    <div id="libList" class="musiclib"></div>
  </div>
  <div class="col" style="padding:10px;">
    <b>导出位置</b>
    <div class="banner">选BGM导出到哪个文件夹。</div>
    <button id="pickOutBtn" class="secondary">📂 选择导出文件夹</button>
    <div id="outInfo" class="fileinfo">未选（默认浏览器下载）</div>
  </div>
</div>

<div class="row">
  <div class="col">
    <h3>② 剧本 + 视频</h3>
    <textarea id="script" placeholder="粘贴整集剧本（含 41-1、41-2 等场号）"></textarea>
    <input type="file" id="video" accept="video/*" style="margin-top:8px;">
    <button id="analyzeBtn" disabled>🔍 分析并自动选曲</button>
    <div class="pbar-wrap" id="pbarWrap"><div class="pbar" id="pbar" style="width:0%">0%</div></div>
    <div id="status" class="status"></div>
  </div>
  <div class="col">
    <h3>③ 情绪弧线</h3>
    <div id="segList"><div style="color:#aaa;font-size:12px;">分析后显示分段</div></div>
  </div>
  <div class="col">
    <h3>④ 段详情 / 试听</h3>
    <div id="detail"><div style="color:#aaa;font-size:12px;">点左侧某段查看</div></div>
  </div>
</div>

<script>
let EMB = [], SONG_MAP = {}, OUT_DIR = null;
let curAudio = null;
let LIB_READY = false;
let API_KEY = localStorage.getItem("dashscope_key") || "";
let STATE = { segments: [], cur: 0, duration: 0 };

const MOOD_MAP = {
  "紧张/对峙": ["紧张 对峙 压迫 危险 黑暗 悬疑"],
  "打斗/爆发": ["激烈 动作 打斗 高潮 节奏快 鼓点"],
  "悲伤/委屈": ["悲伤 委屈 难过 钢琴 孤独 催泪"],
  "温暖/治愈": ["温暖 治愈 家庭 亲情 弦乐 感人"],
  "愤怒/反击": ["愤怒 反击 冲突 爆发 沉重"],
  "冷静/霸气": ["冷静 霸气 坚定 王者 沉稳 史诗"],
  "惊喜/发现": ["惊喜 发现 奇迹 升华  uplifting 梦幻"],
  "阴谋/悬疑": ["阴谋 悬疑 神秘 低沉 诡异 紧张"],
  "回忆/怀旧": ["回忆 怀旧 怀念 钢琴 伤感 时光"],
  "温馨/日常": ["温馨 日常 轻松 吉他 平和 乡村"],
};

document.getElementById("apiKey").value = API_KEY;
document.getElementById("saveKeyBtn").onclick = () => {
  API_KEY = document.getElementById("apiKey").value.trim();
  localStorage.setItem("dashscope_key", API_KEY);
  alert("已保存");
};

function setProgress(el, pct, text) {
  el.parentElement.style.display = "block";
  el.style.width = pct + "%";
  el.textContent = `${pct}% ${text||""}`;
}

async function loadEmb() {
  try {
    const r = await fetch("web_embeddings.json");
    EMB = await r.json();
  } catch(e) {}
}
loadEmb();

async function scanDir(dirHandle, map) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "directory") await scanDir(entry, map);
    else if (entry.kind === "file" && /\.(mp3|wav|m4a|ogg|flac)$/i.test(entry.name)) map[entry.name.toLowerCase()] = entry;
  }
}

document.getElementById("pickBtn").onclick = async () => {
  try {
    const h = await window.showDirectoryPicker();
    SONG_MAP = {};
    document.getElementById("fileInfo").textContent = "扫描中...";
    await scanDir(h, SONG_MAP);
    document.getElementById("fileInfo").textContent = `已选：${h.name}（${Object.keys(SONG_MAP).length} 首）`;
    document.getElementById("analyzeLibBtn").disabled = false;
  } catch(e) {}
};

document.getElementById("analyzeLibBtn").onclick = async () => {
  const n = Object.keys(SONG_MAP).length;
  if (!n) { alert("先选文件夹"); return; }
  const bar = document.getElementById("libPbar");
  setProgress(bar, 5, "匹配向量库...");
  await new Promise(r=>setTimeout(r,200));
  let matched = 0, list = [];
  for (const e of EMB) {
    if (e.voc === "yes") continue;
    if (SONG_MAP[e.fn.toLowerCase()]) { matched++; list.push(e.fn); }
  }
  setProgress(bar, 100, `完成：匹配 ${matched}/${EMB.filter(e=>e.voc!=='yes').length} 首纯器乐`);
  document.getElementById("status").textContent = `音乐库就绪：本地${n}首，可搜纯器乐${matched}首`;
  const lv = document.getElementById("libList");
  lv.innerHTML = list.slice(0,50).map(f=>`<div class="song">🎵 ${f}</div>`).join("") + (list.length>50?`<div style="color:#888;font-size:11px;padding:4px;">...共${list.length}首</div>`:"");
  LIB_READY = true;
  document.getElementById("analyzeBtn").disabled = false;
};

document.getElementById("pickOutBtn").onclick = async () => {
  try {
    OUT_DIR = await window.showDirectoryPicker();
    document.getElementById("outInfo").textContent = `导出到：${OUT_DIR.name}`;
  } catch(e) {}
};

// 调阿里embedding API
async function embedText(text) {
  if (!API_KEY) { alert("请先填阿里云API Key"); throw new Error("no key"); }
  const r = await fetch("https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding", {
    method: "POST",
    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify({ model: "text-embedding-v3", input: [text] })
  });
  const j = await r.json();
  return j.output.embeddings[0].embedding;
}

document.getElementById("analyzeBtn").onclick = async () => {
  if (!LIB_READY) { alert("请先点【分析音乐库】"); return; }
  const script = document.getElementById("script").value;
  const vf = document.getElementById("video").files[0];
  if (!script || !vf) { alert("请填剧本+选视频"); return; }
  const st = document.getElementById("status");
  const bar = document.getElementById("pbar");
  setProgress(bar, 5, "探测视频时长");
  const dur = await probeDuration(vf);
  STATE.duration = dur;
  const scenes = parseScenes(script);
  const n = scenes.length || 1;
  const segLen = dur / n;

  STATE.segments = [];
  for (let i=0;i<scenes.length;i++) {
    const text = scenes[i].text;
    let mood = "紧张/对峙";
    for (const k of Object.keys(MOOD_MAP)) if (k.split("/").some(kw => text.includes(kw))) { mood = k; break; }
    const query = MOOD_MAP[mood][0];
    const pct = 10 + Math.round((i/n)*85);
    setProgress(bar, pct, `场${scenes[i].id} 搜曲中 (${i+1}/${n})`);
    const q = await embedText(query);
    const qn = norm(q);
    let scores = EMB.filter(e => e.voc !== "yes" && SONG_MAP[e.fn.toLowerCase()]).map(e => {
      const en = norm(e.vec);
      let s = 0; for (let j=0;j<qn.length;j++) s += qn[j]*en[j];
      return {sim: s, ...e};
    });
    scores.sort((a,b)=>b.sim-a.sim);
    STATE.segments.push({ id: scenes[i].id, timeStart: i*segLen, timeEnd: (i+1)*segLen, mood, candidates: scores.slice(0,10), track: 0, start: 0, end: segLen+2 });
  }
  setProgress(bar, 100, "完成");
  renderSegList();
  st.textContent = "✅ 完成！点中间段查看详情";
};

function norm(a) { let s=0; for (const x of a) s+=x*x; s=Math.sqrt(s)||1; return a.map(x=>x/s); }
function parseScenes(text) {
  const lines = text.split("\n"); const scenes = []; let cur = null;
  const re = /(\d{1,3}-\d{1,3})/;
  for (const line of lines) {
    const m = line.match(re);
    if (m) { if (cur) scenes.push(cur); cur = {id: m[1], text: line}; }
    else if (cur) cur.text += "\n"+line;
  }
  if (cur) scenes.push(cur); return scenes;
}
function probeDuration(file) {
  return new Promise(res => { const v = document.createElement("video"); v.preload="metadata"; v.onloadedmetadata=()=>res(v.duration); v.src=URL.createObjectURL(file); });
}
function renderSegList() {
  const el = document.getElementById("segList"); el.innerHTML = "";
  STATE.segments.forEach((s,i) => {
    const d = document.createElement("div");
    d.className = "seg" + (i===STATE.cur?" active":"");
    d.innerHTML = `<b>${s.id}</b> <span class="mood">${s.mood}</span><br><span style="color:#666;font-size:11px;">${s.candidates[s.track].fn.slice(0,35)}</span>`;
    d.onclick = () => { STATE.cur = i; renderSegList(); renderDetail(); };
    el.appendChild(d);
  });
}

async function renderDetail() {
  const s = STATE.segments[STATE.cur]; if (!s) return;
  if (curAudio) { curAudio.pause(); curAudio = null; }
  const el = document.getElementById("detail");
  const cur = s.candidates[s.track];
  el.innerHTML = `<b>段 ${s.id}</b> <span class="mood">${s.mood}</span><br>
    <div class="song sel">${cur.fn} (相似度${cur.sim.toFixed(2)})</div>
    <div style="margin-top:8px;">
      <label style="font-size:12px;">开始: <input type="number" id="st" value="${s.start.toFixed(1)}" step="0.5" style="width:70px;"></label>
      <label style="font-size:12px;">结束: <input type="number" id="en" value="${s.end.toFixed(1)}" step="0.5" style="width:70px;"></label>
    </div>
    <div id="cands" style="margin-top:8px;"></div>
    <button id="previewBtn">▶ 播放</button>
    <button id="pauseBtn" class="secondary">⏸ 暂停</button>
    <button id="exportBtn" class="green">💾 导出此段MP3</button>
    <div class="player">
      <input type="range" id="seekBar" min="0" max="100" value="0">
      <div class="time"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>`;
  const cands = document.getElementById("cands");
  s.candidates.forEach((c,i) => {
    const d = document.createElement("div");
    d.className = "song" + (i===s.track?" sel":"");
    d.textContent = `[${i}] ${c.fn.slice(0,40)} (${c.sim.toFixed(2)})`;
    d.onclick = () => { s.track = i; renderDetail(); };
    cands.appendChild(d);
  });
  document.getElementById("previewBtn").onclick = async () => {
    s.start = parseFloat(document.getElementById("st").value);
    s.end = parseFloat(document.getElementById("en").value);
    const fh = SONG_MAP[cur.fn.toLowerCase()];
    if (!fh) { alert("找不到文件："+cur.fn); return; }
    if (curAudio) curAudio.pause();
    const file = await fh.getFile();
    curAudio = new Audio(URL.createObjectURL(file));
    curAudio.currentTime = s.start;
    curAudio.play();
    const bar = document.getElementById("seekBar");
    curAudio.ontimeupdate = () => {
      const pct = ((curAudio.currentTime - s.start) / (s.end - s.start)) * 100;
      bar.value = Math.max(0, Math.min(100, pct));
      document.getElementById("curTime").textContent = fmt(curAudio.currentTime - s.start);
      if (curAudio.currentTime >= s.end) curAudio.pause();
    };
    curAudio.onloadedmetadata = () => { document.getElementById("durTime").textContent = fmt(s.end - s.start); };
    bar.oninput = () => { curAudio.currentTime = s.start + (bar.value/100)*(s.end-s.start); };
  };
  document.getElementById("pauseBtn").onclick = () => { if (!curAudio) return; if (curAudio.paused) curAudio.play(); else curAudio.pause(); };
  document.getElementById("exportBtn").onclick = async () => {
    const fh = SONG_MAP[cur.fn.toLowerCase()];
    if (!fh) { alert("找不到文件"); return; }
    const file = await fh.getFile();
    if (OUT_DIR) {
      const w = await OUT_DIR.getFileHandle(`${s.id}_${cur.fn}`, {create:true});
      const w2 = await w.createWritable();
      await w2.write(await file.slice(s.start, s.end).arrayBuffer());
      await w2.close();
      alert("已导出到：" + OUT_DIR.name);
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(await file.slice(s.start, s.end).arrayBuffer());
      a.download = `${s.id}_${cur.fn}`;
      a.click();
    }
  };
}
function fmt(t) { t=Math.max(0,t|0); return `${(t/60)|0}:${String(t%60).padStart(2,'0')}`; }
</script>
</body>
</html>
